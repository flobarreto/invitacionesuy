name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: PostgreSQL migrations and legacy fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/invitia_migrations
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invitia_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invitia_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap isolated Supabase compatibility objects
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/postgres_bootstrap.sql

      - name: Load representative legacy schema
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/legacy_schema_before_v2.sql

      - name: Apply all versioned migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file="${migration}"
          done

      - name: Verify migrations are replay-safe
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Reapplying ${migration}"
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file="${migration}"
          done

      - name: Verify core backfill, dual-write and cutover
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/legacy_core_migration.sql

      - name: Verify floor-plan reconciliation and review gate
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/legacy_floor_plan_reconciliation.sql

      - name: Verify floor-plan background path isolation
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/floor_plan_background_security.sql

      - name: Verify durable WhatsApp inbound and outbound workflow
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/whatsapp_outbox.sql

      - name: Verify canonical CRM, campaign and seating workflow
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/canonical_crm_seating.sql

  verify:
    name: Validate, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://127.0.0.1:3100
      ENABLE_STATIC_INVITATION_EVENT_ADAPTER: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      WHATSAPP_GLOBAL_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/whatsapp/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Reject remote font dependencies
        run: |
          if git grep -nE '(next/font/google|fonts\.(googleapis|gstatic)\.com)' -- '*.ts' '*.tsx' '*.css' '*.scss'; then
            echo 'Remote font dependency detected; invitation builds must use repository assets.'
            exit 1
          fi

      - name: Audit high and critical dependency vulnerabilities
        run: npm run security:audit

      - name: Validate invitation registry
        run: npm run invitation:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Verify WhatsApp worker lockfile and types
        working-directory: workers/whatsapp
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public route smoke tests (390 px and 1440 px)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
